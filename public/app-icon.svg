    <!-- Middle left leaf (facing occiput) -->
    <path d="M 256 256 C 236 240 208 244 188 260 C 196 276 216 288 244 280 C 252 268 256 260 256 256 Z" stroke-width="2" />
    
    <!-- Lower right leaf -->
    <path d="M 252 296 C 272 288 300 292 316 308 C 308 324 288 336 264 328 C 256 316 252 304 252 296 Z" stroke-width="2" />
    
    <!-- Bottom left leaf -->
    <path d="M 252 340 C 236 332 216 336 200 352 C 208 368 228 372 252 364 C 256 352 256 344 252 340 Z" stroke-width="2" />
  </g>

  <!-- Sparkle Star (✦) near forehead in #F8F3E9 -->
  <path d="
    M 428 184
    Q 428 204 408 204
    Q 428 204 428 224
    Q 428 204 448 204
    Q 428 204 428 184 Z
  " fill="#F8F3E9" />
</svg>
