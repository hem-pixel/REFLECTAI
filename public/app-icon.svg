<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#964b18" />
      <stop offset="100%" stop-color="#7d3b0e" />
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdfbf7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f4ede1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#appBgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" stroke="#fcf9f4" stroke-opacity="0.15" stroke-width="6" fill="none" />

  <!-- Soft aura behind head -->
  <circle cx="248" cy="260" r="168" fill="url(#haloGrad)" />

  <!-- Head silhouette (facing right) in soft cream #F8F3E9 -->
  <g fill="#F8F3E9">
