      C 388 264 408 280 416 292
      C 420 296 416 304 404 308
      C 396 312 388 312 388 320
      C 392 324 400 332 400 336
      C 400 344 388 348 384 352
      C 388 360 396 368 392 380
      C 388 392 376 400 360 404
      C 336 408 316 388 308 368
      C 300 368 292 388 276 400
