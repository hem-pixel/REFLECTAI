<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <title>ReflectAI - Gemini Journal & Reflections</title>
    <meta name="description" content="A user-authenticated reflection and journaling web application powered by Gemini and isolated Cloud Firestore storage." />
    <meta property="og:title" content="ReflectAI - Gemini Journal & Reflections" />
    <meta property="og:description" content="A user-authenticated reflection and journaling web application powered by Gemini and isolated Cloud Firestore storage." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Immediate 0ms styling to guarantee zero white flash */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #fcf9f4;
        color: #282220;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #initial-splash-fallback {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #fcf9f4;
        background-image: radial-gradient(ellipse at 50% 45%, #f5ece2 0%, #fcf9f4 75%);
        user-select: none;
      }
    </style>
  </head>
  <body class="bg-[#fcf9f4] text-[#282220]">
    <div id="root">
      <!-- 0ms Immediate Startup UI: Rendered by browser before JavaScript bundle finishes loading -->
      <div id="initial-splash-fallback">
        <div style="width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <img
            src="/reflectai-logo.png"
            alt="ReflectAI Logo"
            style="width: 100%; height: 100%; object-fit: contain; border-radius: 24px; box-shadow: 0 4px 14px rgba(90, 40, 10, 0.12);"
          />
        </div>
        <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 36px; font-weight: 600; color: #3E2723; letter-spacing: -0.5px; margin-bottom: 8px;">
          <span>Reflect</span><span style="color: #8B4513;">AI</span>
        </div>
        <div style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.24em; color: #A67C52; text-transform: uppercase;">
          Think • Reflect • Grow
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
